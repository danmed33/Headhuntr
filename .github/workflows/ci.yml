name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  exemplos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exemplos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
